<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>تحدي المعلومات</title>
<style>
:root{--bg:#f6f4ee;--cd:#fff;--tx:#1b1b1f;--mu:#6b6b76;--bd:#e2dfd5;--ac:#5b3df5;--c0:#e5484d;--c1:#2f7de1;--c2:#1f9d62;--c3:#c77a00;--ok:#1f9d62;--no:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14141a;--cd:#1f1f28;--tx:#f1f1f5;--mu:#9a9aa8;--bd:#33333f;--ac:#8b78ff;--c0:#ff6b6f;--c1:#5aa0ff;--c2:#3ccf8a;--c3:#f0a030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14141a;--cd:#1f1f28;--tx:#f1f1f5;--mu:#9a9aa8;--bd:#33333f;--ac:#8b78ff;--c0:#ff6b6f;--c1:#5aa0ff;--c2:#3ccf8a;--c3:#f0a030;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,system-ui,-apple-system,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:18px 14px 40px}
h1{margin:0 0 4px;font-size:28px}h2{font-size:21px;margin:8px 0 14px}.mu{color:var(--mu);margin:0 0 14px}
button{font:inherit;color:inherit;cursor:pointer}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--bd);background:var(--cd);border-radius:20px;padding:6px 16px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.tm{background:var(--cd);border:2px solid var(--bd);border-top:5px solid var(--c);border-radius:12px;padding:10px;cursor:pointer}.tm.act{border-color:var(--c)}
.tm input{width:100%;font:inherit;font-weight:600;background:transparent;color:var(--tx);border:0;border-bottom:1px dashed var(--bd);padding:2px 0;margin-bottom:4px}
.tm small,.sc small,.sub small,.hd small{color:var(--mu);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:18px}
.sub{background:var(--cd);border:2px solid var(--bd);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.sub span{font-size:26px}.sub[data-o]{border-color:var(--c);box-shadow:inset 0 0 0 2px var(--c)}
.go{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 26px;font-weight:700;font-size:17px}.go:disabled{opacity:.4;cursor:not-allowed}
.lk{background:none;border:0;color:var(--mu);margin-top:12px;text-decoration:underline}
.score{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sc{flex:1;min-width:110px;background:var(--cd);border:2px solid var(--bd);border-inline-start:6px solid var(--c);border-radius:12px;padding:8px 12px;display:flex;flex-direction:column}
.sc.act{border-color:var(--c)}.sc span{font-size:26px;font-weight:800}.sc small{min-height:18px}
.bw{overflow-x:auto;padding-bottom:6px}.bd{display:grid;gap:6px;min-width:max-content;width:100%}
.hd{background:var(--cd);border:1px solid var(--bd);border-top:5px solid var(--c);border-radius:10px;padding:8px 4px;text-align:center;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center}.hd span{font-size:22px}
.tile{background:var(--c);color:#fff;border:0;border-radius:10px;padding:16px 4px;font-size:22px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile:hover:not(:disabled){filter:brightness(1.1)}.tile.dn{background:var(--cd);color:transparent;border:1px dashed var(--bd);text-shadow:none;cursor:default}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.md{background:var(--cd);border-radius:16px;padding:22px;max-width:580px;width:100%;max-height:92%;overflow:auto;text-align:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.op{background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:12px 8px;font-weight:600}
.op:hover:not(:disabled){border-color:var(--ac)}.op.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.op.no{background:var(--no);color:#fff;border-color:var(--no)}
.ans{background:var(--bg);border:2px solid var(--ac);border-radius:12px;padding:12px;font-size:22px;font-weight:700;margin-bottom:12px}.aw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.aw button{border:2px solid var(--c,var(--bd));background:var(--cd);border-radius:10px;padding:8px 14px;font-weight:600}@media(max-width:420px){.opts{grid-template-columns:1fr}}
.rk{background:var(--cd);border:1px solid var(--bd);border-inline-start:6px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:8px;display:flex;justify-content:space-between;font-weight:700}

html:root:root{--bg:#10121f;--cd:#181b2e;--tx:#e9eaf2;--mu:#9a9db5;--bd:#2b2f4a;--ac:#6ab7e6;--c0:#e96f93;--c1:#5db4e6;--c2:#7fcf8e;--c3:#e6a64f;--ok:#7fcf8e;--no:#e96f93;color-scheme:dark}
h1{color:var(--tx)}
.tile{background:color-mix(in srgb,var(--c) 16%,var(--cd));color:var(--tx);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);box-shadow:none;text-shadow:none}
.tile:hover:not(:disabled){background:color-mix(in srgb,var(--c) 28%,var(--cd));filter:none}
.tile.dn{background:transparent;color:transparent;border:1px dashed var(--bd)}
.hd{border:1px solid var(--bd);border-top:3px solid var(--c);box-shadow:none}
.sc.act,.tm.act{box-shadow:none}
.sub[data-o]{box-shadow:inset 0 0 0 2px var(--c)}
.go{background:var(--ac);color:#0b1220;border:0;box-shadow:none;text-shadow:none}
.chip.on{color:#0b1220;box-shadow:none}
.ov{background:rgba(8,9,18,.8)}
.md{border:1px solid var(--bd);box-shadow:none}
.op.ok{background:color-mix(in srgb,var(--ok) 22%,var(--cd));color:var(--tx);border-color:var(--ok);box-shadow:none}
.op.no{background:color-mix(in srgb,var(--no) 22%,var(--cd));color:var(--tx);border-color:var(--no);box-shadow:none}
.ans{border-color:var(--ac);box-shadow:none}
.aw button:hover{box-shadow:none}
</style></head><body><div id="app"></div>
<script src="questions.js"></script>
<script>
// Format per question: 'السؤال|الإجابة الصحيحة|خطأ1|خطأ2|خطأ3'. Each subject: 3 easy, 3 medium, 2 hard (add more to each tier for more variety).
const S=(window.QUESTIONS||[]).map(s=>[s.n,s.e,s.q]);
const PTS=[100,200,300,400,500,600],COL=['var(--c0)','var(--c1)','var(--c2)','var(--c3)'],MAXT=Math.floor(S.length/3);
let st={n:2,names:['الفريق 1','الفريق 2','الفريق 3','الفريق 4'],pick:[[],[],[],[]],cur:0,screen:'setup'},g=null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let seen=new Set();try{seen=new Set(JSON.parse(localStorage.getItem('seenQ')||'[]'))}catch(e){}
function saveSeen(){try{localStorage.setItem('seenQ',JSON.stringify([...seen]))}catch(e){}}
function resetSeen(){seen=new Set();saveSeen();alert('تمت إعادة ضبط الأسئلة المعروضة')}
function setN(k){st.n=k;if(st.cur>=k)st.cur=0;for(let t=k;t<4;t++)st.pick[t]=[];R()}
function tog(i){const o=st.pick.findIndex((p,t)=>t<st.n&&p.includes(i));
 if(o>=0){st.pick[o]=st.pick[o].filter(x=>x!=i);st.cur=o}
 else if(st.pick[st.cur].length<3){st.pick[st.cur].push(i);if(st.pick[st.cur].length==3){const nx=[...Array(st.n).keys()].find(t=>st.pick[t].length<3);if(nx!=null)st.cur=nx}}
 R()}
function begin(){const cols=[];
 for(let t=0;t<st.n;t++)for(const s of st.pick[t]){const q=S[s][2].map(x=>{const a=x.split('|');return{id:s+':'+a[1],l:+a[0],q:a[1],c:a[2],o:sh(a.slice(2))}});const used=new Set();
  const items=PTS.map((p,i)=>{let pool=q.filter(x=>x.l==i+1&&!used.has(x.id));if(!pool.length)pool=q.filter(x=>!used.has(x.id));let f=pool.filter(x=>!seen.has(x.id));if(!f.length){pool.forEach(x=>seen.delete(x.id));f=pool}const x=sh(f)[0];used.add(x.id);seen.add(x.id);return{...x,p,done:false}});
  cols.push({t,s,items})}
 saveSeen();g={cols,scores:Array(st.n).fill(0),turn:0,open:null,tried:[],shown:false};st.screen='play';R()}
function openQ(c,r){g.open={c,r};g.tried=[];g.shown=false;R()}
function pickO(o){const it=g.cols[g.open.c].items[g.open.r];if(!g.tried.includes(o))g.tried.push(o);if(o==it.c)g.shown=true;R()}
function award(t){const it=g.cols[g.open.c].items[g.open.r];if(t>=0)g.scores[t]+=it.p;it.done=true;g.turn=(g.turn+1)%st.n;g.open=null;g.tried=[];g.shown=false;
 if(g.cols.every(c=>c.items.every(i=>i.done)))st.screen='end';R()}
function newGame(){st.pick=[[],[],[],[]];st.cur=0;st.screen='setup';R()}
function setup(){const own=i=>st.pick.findIndex((p,t)=>t<st.n&&p.includes(i));
 const ready=st.pick.slice(0,st.n).every(p=>p.length==3);
 return `<h1>تحدي المعلومات</h1><p class="mu">يختار كل فريق 3 مواضيع. لكل موضوع 6 أسئلة بنقاط من 100 إلى 600 (سؤال الـ500 فقط باختيار متعدد)، وبعد الإجابة الخاطئة يمكن لفريق آخر السرقة. تتغير الأسئلة عشوائياً مع كل لعبة جديدة.</p>
 <div class="row">عدد الفرق: ${Array.from({length:MAXT-1},(_,i)=>i+2).map(k=>`<button class="chip ${st.n==k?'on':''}" onclick="setN(${k})">${k}</button>`).join('')}</div>
 <div class="teams">${[...Array(st.n)].map((_,t)=>`<div class="tm ${st.cur==t?'act':''}" style="--c:${COL[t]}" onclick="st.cur=${t};R()"><input value="${esc(st.names[t])}" onclick="event.stopPropagation()" onchange="st.names[${t}]=this.value||'الفريق ${t+1}';R()"><small>${st.pick[t].length}/3 مواضيع${st.cur==t?' · يختار الآن':''}</small></div>`).join('')}</div>
 <div class="grid">${S.map((s,i)=>{const o=own(i);return `<button class="sub" ${o>=0?`style="--c:${COL[o]}" data-o="1"`:''} onclick="tog(${i})"><span>${s[1]}</span>${s[0]}${o>=0?`<small>${esc(st.names[o])}</small>`:''}</button>`}).join('')}</div>
 <button class="go" ${ready?'':'disabled'} onclick="begin()">ابدأ اللعبة</button><br><button class="lk" onclick="resetSeen()">إعادة ضبط الأسئلة المعروضة</button>`}
function play(){let m='';
 if(g.open){const c=g.cols[g.open.c],it=c.items[g.open.r],mc=it.p==500;
  m=`<div class="ov"><div class="md"><small class="mu">${S[c.s][1]} ${S[c.s][0]} · ${it.p} نقطة · الدور على ${esc(st.names[g.turn])}</small><h2>${esc(it.q)}</h2>${mc?`<div class="opts">${it.o.map(o=>`<button class="op ${g.tried.includes(o)?(o==it.c?'ok':'no'):(g.shown&&o==it.c?'ok':'')}" ${g.tried.includes(o)||g.shown?'disabled':''} data-o="${esc(o)}" onclick="pickO(this.dataset.o)">${esc(o)}</button>`).join('')}</div>`:''}${g.shown?`${mc?'':`<div class="ans">${esc(it.c)}</div>`}<p class="mu">من يحصل على النقاط؟</p><div class="aw">${g.scores.map((_,t)=>`<button style="--c:${COL[t]}" onclick="award(${t})">${esc(st.names[t])}</button>`).join('')}<button onclick="award(-1)">لا أحد</button></div>`:`${g.tried.length?'<p class="mu">إجابة خاطئة! يمكن لفريق آخر أن يسرق النقاط</p>':''}<button class="go" onclick="g.shown=true;R()">إظهار الإجابة</button>`}<br><button class="lk" onclick="g.open=null;R()">العودة إلى اللوحة</button></div></div>`}
 return `<div class="score">${g.scores.map((s,t)=>`<div class="sc ${g.turn==t?'act':''}" style="--c:${COL[t]}"><small>${g.turn==t?'◂ دوره الآن':''}</small><b>${esc(st.names[t])}</b><span>${s}</span></div>`).join('')}</div>
 <div class="bw"><div class="bd" style="grid-template-columns:repeat(${g.cols.length},minmax(96px,1fr))">
 ${g.cols.map(c=>`<div class="hd" style="--c:${COL[c.t]}"><span>${S[c.s][1]}</span>${S[c.s][0]}<small>${esc(st.names[c.t])}</small></div>`).join('')}
 ${PTS.map((_,r)=>g.cols.map((c,ci)=>{const it=c.items[r];return `<button class="tile ${it.done?'dn':''}" style="--c:${COL[c.t]}" ${it.done?'disabled':''} onclick="openQ(${ci},${r})">${it.p}</button>`}).join('')).join('')}
 </div></div>${m}`}
function end(){const r=g.scores.map((s,t)=>({s,t})).sort((a,b)=>b.s-a.s),top=r.filter(x=>x.s==r[0].s);
 return `<h1>انتهت اللعبة</h1><h2>${top.length>1?'تعادل بين: '+top.map(x=>esc(st.names[x.t])).join(' و '):'🏆 الفائز: '+esc(st.names[top[0].t])}</h2>
 ${r.map(x=>`<div class="rk" style="--c:${COL[x.t]}"><span>${esc(st.names[x.t])}</span><span>${x.s}</span></div>`).join('')}
 <div class="row" style="margin-top:16px"><button class="go" onclick="begin()">إعادة بنفس المواضيع (أسئلة جديدة)</button><button class="chip" onclick="newGame()">لعبة جديدة</button></div>`}
function R(){if(!S.length){document.getElementById('app').innerHTML='<h1>ملف الأسئلة questions.js غير موجود</h1>';return}document.getElementById('app').innerHTML=st.screen=='setup'?setup():st.screen=='play'?play():end()}
R();
</script></body></html>
